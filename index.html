<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Interview Listener</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🎤 Smart Interview Listener</h1>

  <button id="startBtn">▶ Start Interview</button>
  <button id="stopBtn">⏹ Stop</button>

  <div class="box">
    <h3>🗣 Interviewer Question:</h3>
    <p id="question">Waiting...</p>
  </div>

  <div class="box">
    <h3>🤖 AI Suggested Answer:</h3>
    <p id="answer">AI will respond here...</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
