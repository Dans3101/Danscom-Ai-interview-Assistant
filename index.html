<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Danscom AI Interview Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🎤 Danscom AI Assistant</h1>

  <div class="system-status">
    <div id="status-container">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Connecting to AI...</span>
    </div>
    <div id="timer">00:00</div>
  </div>

  <div class="controls">
    <button id="startBtn">▶ Start Voice</button>
    <button id="screenBtn" style="background: #3b82f6; color: white;">📺 Monitor Screen</button>
    <button id="stopBtn" disabled>⏹ Stop All</button>
  </div>

  <div id="visualizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <canvas id="snapshotCanvas" style="display:none;"></canvas>

  <div class="box">
    <h3>🗣 Your Transcript / Screen Text:</h3>
    <p id="question">Waiting for audio or screen input...</p>
  </div>

  <div class="box">
    <h3>🤖 AI Feedback & Suggestions (Text):</h3>
    <p id="answer">AI feedback will appear here.</p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
